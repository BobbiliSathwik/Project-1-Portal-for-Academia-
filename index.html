<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>SkillAura | Connecting Skills, Academia &amp; Industry</title>
	<meta
		name="description"
		content="SkillAura connects students, academia and industry through verified skills and opportunities."
	/>
	<script>
		try {
			document.documentElement.dataset.theme = localStorage.getItem('skillaura-theme') === 'dark' ? 'dark' : 'light';
		} catch (error) {
			document.documentElement.dataset.theme = 'light';
		}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
		rel="stylesheet"
	>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div id="global-background" aria-hidden="true"></div>
	<div id="app"></div>
	<script src="js/app.js"></script>
</body>
</html>
